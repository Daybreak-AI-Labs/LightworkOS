      - Contributor License Agreement: CLA.md
      - Code of Conduct: CODE_OF_CONDUCT.md
      - Security policy: SECURITY.md
      - Trademark policy: TRADEMARK.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Daybreak-AI-Labs/LightworkOS
  generator: false

# Preview the full documentation set locally:
#   python -m pip install --requirement requirements/docs.txt
#   mkdocs serve
# The published site is built from mkdocs.public.yml and the
# docs/public-docs.txt allowlist by .github/workflows/docs.yml.
