[package]
name = "maverick-installer-desktop"
version = "0.1.7"
edition = "2021"
description = "Tauri GUI installer for Lightwork"
authors = ["The Lightwork Authors"]
license = "Apache-2.0"
repository = "https://github.com/Daybreak-AI-Labs/LightworkOS"

[lib]
name = "maverick_installer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Standard Tauri v2 layout: logic in lib.rs (run()), and a thin main.rs
# that calls it. The binary is declared explicitly so `tauri build` has a
# binary target to build.
[[bin]]
name = "maverick-installer-desktop"
path = "src/main.rs"

[build-dependencies]
sha2 = "=0.10.9"
tauri-build = { version = "2", features = [] }

[dependencies]
lightwork-desktop-runtime = { path = "../../desktop-runtime" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Reviewed source fixes; provenance and regression coverage live in vendor/README.md.
[patch.crates-io]
glib = { path = "../../../vendor/rust/glib" }
glib-macros = { path = "../../../vendor/rust/glib-macros" }
gtk3-macros = { path = "../../../vendor/rust/gtk3-macros" }
