name: Runtime performance evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/requirements/ci.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.13'
      - name: Install runtime packages
        run: python -m pip install -e ./packages/maverick-core -e ./packages/maverick-knowledge
      - name: Measure synthetic workloads
        env:
          MAVERICK_HOME: ${{ runner.temp }}/lightwork-perf-home
        run: python -m benchmarks.runtime_performance --samples 20 --output runtime-performance.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: runtime-performance
          path: runtime-performance.json
          if-no-files-found: error
          retention-days: 14
