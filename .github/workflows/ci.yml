  harness-overhead:
    needs: select-tests
    # Skipped on a pull request whose change set cannot affect this job (select-tests).
    if: "${{ !cancelled() && !contains(needs.select-tests.outputs.jobs, '\"harness-overhead\": false') }}"
    # What the governance record COSTS: identical deterministic tasks run in
    # governed and ungoverned arms, stubbed at the model boundary so both call
    # the same pure function. No provider key, model, or network. The
    # deterministic invariants (equal model calls / tokens / steps, identical
    # results, the expected evidence artifacts) are hard gates; measured wall
    # time is recorded but never a pass/fail threshold — it is machine noise.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.13"
      - name: Install overhead benchmark dependencies
        run: |
          python -m pip install -e './packages/maverick-core[audit-signing]'
          python -m pip install -e ./packages/maverick-shield
          python -m pip install pytest pytest-asyncio
      - name: Harness-overhead focused tests
        run: >-
          python -m pytest -q
          packages/maverick-core/tests/test_eval_harness_overhead.py
      - name: Verify checked-in harness-overhead artifacts
        run: >-
          python benchmarks/eval_harness_overhead.py
          --verify-tracked-artifacts
      - name: Assert the deterministic overhead invariants
        run: python benchmarks/eval_harness_overhead.py --ci
      - name: Measured offline governed-vs-ungoverned run
        run: >-
          python benchmarks/eval_harness_overhead.py
          --output "$RUNNER_TEMP/harness-overhead-manifest.json"
          --report "$RUNNER_TEMP/harness-overhead-report.md"
          --publisher-key-out "$RUNNER_TEMP/harness-overhead.pub"
      - name: Verify signed run manifest
        run: >-
          python benchmarks/eval_harness_overhead.py
          --verify-manifest "$RUNNER_TEMP/harness-overhead-manifest.json"
          --trusted-pubkey-file "$RUNNER_TEMP/harness-overhead.pub"

  postgres:
    needs: select-tests
    # Skipped on a pull request whose change set cannot affect this job (select-tests).
    if: "${{ !cancelled() && !contains(needs.select-tests.outputs.jobs, '\"postgres\": false') }}"
    # DB-backed tests for the Postgres world-model backend. The default `test`
    # job has no Postgres, so test_postgres_world.py skips there; this job
    # stands up a service + DSN so the backend is actually exercised in CI.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # pgvector image = postgres:16 + the `vector` extension, so the same
        # service also exercises the pgvector knowledge store (round-trip below).
        # pgvector/pgvector:pg16 multi-arch index, resolved 2026-07-29.
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_USER: maverick
          POSTGRES_PASSWORD: maverick
          POSTGRES_DB: maverick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.13"
      - name: Install
        run: |
          set -x
          python -m pip install --upgrade \
            'pip==26.2.2' 'setuptools==84.2.1' 'wheel==0.48.0' \
            'packaging==26.3'
          pip install -e './packages/maverick-core[postgres]'
          pip install -e ./packages/maverick-knowledge
          # Event-origin goals take the dashboard's event registry lock before
          # they start (maverick.event_admission), so the live Postgres start
          # boundary tests need the dashboard package importable.
          pip install -e ./packages/maverick-dashboard
          pip install \
            'psycopg==3.3.6' 'psycopg-binary==3.3.6' \
            'psycopg-pool==3.3.3' 'sqlalchemy==2.0.55'
          pip install pytest pytest-asyncio pytest-timeout
          python -m pip check
          python scripts/verify_constraint_closure.py
      - name: Test live Postgres backends and governance invariants
        env:
          MAVERICK_PG_DSN: postgres://maverick:maverick@localhost:5432/maverick_test
        run: >-
          timeout --verbose --signal=ABRT --kill-after=30s 10m
          python -m pytest -vvs --timeout=180 --timeout-method=signal
          packages/maverick-core/tests/test_postgres_world.py
          packages/maverick-core/tests/test_intent_value.py
          packages/maverick-core/tests/test_database_tool.py
          packages/maverick-core/tests/test_database_connection_timeouts.py
          packages/maverick-core/tests/test_database_connection_hosts.py
          packages/maverick-core/tests/test_production_runtime_regressions.py
          packages/maverick-core/tests/test_pgvector_isolation_pg.py
          packages/maverick-core/tests/test_postgres_fact_history.py
          packages/maverick-core/tests/test_postgres_facts_trust.py
          packages/maverick-core/tests/test_postgres_governed_records_capacity.py
          packages/maverick-core/tests/test_consent_storage.py
      - name: Test database connection recovery under secure defaults
        env:
          MAVERICK_TEST_SECURE_DEFAULT: "1"
        run: >-
          timeout --verbose --signal=ABRT --kill-after=30s 5m
          python -m pytest -vvs --timeout=45 --timeout-method=signal
          packages/maverick-core/tests/test_database_tool.py
          packages/maverick-core/tests/test_database_connection_timeouts.py
          packages/maverick-core/tests/test_database_connection_hosts.py
          packages/maverick-core/tests/test_production_runtime_regressions.py
      - name: Test pgvector knowledge store
        env:
          MAVERICK_PG_DSN: postgres://maverick:maverick@localhost:5432/maverick_test
        run: >-
          timeout --verbose --signal=ABRT --kill-after=30s 5m
          python -m pytest -vvs --timeout=180 --timeout-method=signal
          packages/maverick-knowledge/tests/test_knowledge.py -k PgVectorLive

  docker:
    needs: select-tests
    # Skipped on a pull request whose change set cannot affect this job (select-tests).
    if: "${{ !cancelled() && !contains(needs.select-tests.outputs.jobs, '\"docker\": false') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build image
        # Docker Hub base-image pulls intermittently time out on CI runners
        # (registry-1.docker.io i/o timeout). Retry with backoff so a transient
        # registry blip doesn't fail the whole job.
        run: |
          n=0; max=4
          until docker build \
            --build-arg 'PYTHON_DIGEST=@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de' \
            -f deploy/docker/Dockerfile -t maverick:ci .; do
            n=$((n+1))
            if [ "$n" -ge "$max" ]; then
              echo "::error::docker build failed after $max attempts (registry/network)"
              exit 1
            fi
            echo "docker build attempt $n/$max failed; retrying in $((n*15))s"
            sleep $((n*15))
          done
      - name: Smoke run
        # Beyond --help: dashboard and mcp import maverick-dashboard /
        # maverick-mcp. Before those packages were added to the image they
        # exited 2 ("Install: pip install ..."). These prove they're present.
        run: |
          docker run --rm maverick:ci --help
          docker run --rm maverick:ci dashboard --help
          docker run --rm maverick:ci mcp --help
          docker run --rm --entrypoint python maverick:ci -c \
            "import maverick_evolve, maverick_knowledge"
