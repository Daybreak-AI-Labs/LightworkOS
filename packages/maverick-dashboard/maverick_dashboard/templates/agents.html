  {% if (selected or creating) and editable %}
  {# Server values for the editor script below, so that script stays plain JavaScript. #}
  <script nonce="{{ csp_script_nonce }}" type="application/json" id="agent-editor-data">{{ {"services": (selected.mcp_servers if selected else []), "model_options": (model_options | default([])), "model_roles": (model_roles | default([])), "models": (selected.models if selected else {})} | tojson }}</script>
  <script nonce="{{ csp_script_nonce }}">
    // ---- save / validate / reset (real agent-override endpoints) ----
    (function () {
      const form = document.getElementById('agent-form');
      if (!form) return;
      const creating = form.dataset.creating === '1';
      const idInput = document.getElementById('f-new-id');
      const msg = document.getElementById('agent-msg');
      let retainedDraftName = '';
      let editorPrivateLocked = false;
      const editorData = JSON.parse((document.getElementById('agent-editor-data') || {}).textContent || '{}');
      let serviceDraft = editorData.services || [];
      if (form.dataset.toolServices) { try { serviceDraft = JSON.parse(form.dataset.toolServices); } catch (_) {} }
      let serviceChoices = null;
      function renderServices() {
        const host = document.getElementById('agent-tool-service-choices'); host.replaceChildren();
        const rows = new Map((serviceChoices || []).map(row => [row.value, row]));
        serviceDraft.forEach(name => { if (!rows.has(name)) rows.set(name, {value: name, label: name.replace(/[_-]/g, ' ') + (serviceChoices ? ' · Setup unavailable' : ' · Setup not yet checked'), available: false}); });
        rows.forEach(row => {
          const label = document.createElement('label'), choice = document.createElement('input');
          choice.type = 'checkbox'; choice.value = row.value; choice.checked = serviceDraft.includes(row.value);
          choice.disabled = editorPrivateLocked || (!row.available && !choice.checked); label.style.display = 'block';
          label.append(choice, document.createTextNode(' ' + row.label)); host.append(label);
          choice.addEventListener('change', () => {
            serviceDraft = choice.checked ? [...serviceDraft, row.value] : serviceDraft.filter(name => name !== row.value);
            renderServices(); host.dispatchEvent(new Event('input', {bubbles: true}));
          });
        });
        document.getElementById('agent-tool-service-status').textContent = serviceChoices === null ? 'Refresh the complete draft to read current service choices.' : rows.size ? 'Your entered selections are kept when service choices refresh. Unavailable saved services can be removed.' : 'No tool services are configured. Add one in Tool servers, then refresh this draft.';
      }
      renderServices();
      // The target agent name: the pre-selected pack, or (new mode) the id typed
      // in. Normalized to the lowercase/underscore shape packs use.
      function targetName() {
        if (!creating) return form.dataset.name;
        if (retainedDraftName && idInput.value.trim() === retainedDraftName) return retainedDraftName;
        return (idInput ? idInput.value : '').trim().toLowerCase().replace(/[^a-z0-9_]+/g, '_').replace(/^_+|_+$/g, '');
      }
      const modelOptions = editorData.model_options || [];
      const modelRoles = editorData.model_roles || [];
      let modelDraft = editorData.models || {};
      function modelSelect(field, value) {
        field.replaceChildren(new Option('Use the workspace choice', ''));
        modelOptions.forEach(([spec, label]) => field.add(new Option(label, spec)));
        if (value && !modelOptions.some(([spec]) => spec === value)) {
          const retained = new Option('Saved choice · ' + value.split(':').pop().replace(/[-_]/g, ' '), value); retained.disabled = true; field.add(retained);
        }
        field.value = value || '';
      }
      function applyModels(models) {
        modelDraft = {...(models || {})};
        modelSelect(document.getElementById('f-model'), modelDraft[targetName()]);
        const host = document.getElementById('agent-supporting-models'); host.replaceChildren();
        const roles = new Map(modelRoles.map(row => [row.role, row.label]));
        Object.keys(modelDraft).forEach(role => { if (!roles.has(role)) roles.set(role, role.replace(/[_.-]/g, ' ')); });
        let index = 0;
        roles.forEach((label, role) => {
          if (role === targetName()) return;
          const row = document.createElement('div'); row.className = 'fld';
          const title = document.createElement('label'), choice = document.createElement('select');
          choice.id = 'f-supporting-model-' + index++; choice.className = 'input'; choice.dataset.modelRole = role;
          title.htmlFor = choice.id; title.textContent = label; modelSelect(choice, modelDraft[role]); row.append(title, choice); host.append(row);
        });
      }
      function gatherModels() {
        const models = {...modelDraft};
        document.querySelectorAll('#agent-supporting-models [data-model-role]').forEach(choice => {
          if (choice.value) models[choice.dataset.modelRole] = choice.value; else delete models[choice.dataset.modelRole];
        });
        const role = targetName(), choice = document.getElementById('f-model').value;
        if (role) { if (choice) models[role] = choice; else delete models[role]; }
        return models;
      }
      applyModels(modelDraft);
      const words = (s) => s.split(/\s+/).filter(Boolean);
      function show(text, ok) { if (window.mvStatus) window.mvStatus(msg, text, {error: !ok}); else msg.textContent = text; msg.style.color = ok ? 'var(--accent)' : 'var(--danger)'; }
      function fieldMessage(field, text) {
        ['agent-actions-error', 'agent-risk-error'].forEach(function (id) {
          var note = document.getElementById(id);
          if (note) { note.hidden = true; note.textContent = ''; }
        });
        var note = document.getElementById(field === 'actions' ? 'agent-actions-error'
          : field === 'risk' ? 'agent-risk-error' : '');

      }
      function kindWord() {
        var form = document.getElementById('agent-form');
        return form && form.dataset.kind === 'specialist' ? 'specialist' : 'agent';
      }
      function saveProblem(detail) {
        var raw = typeof detail === 'string' ? detail : '';
        var added = raw.match(/allow_tools cannot add tools beyond the built-in pack:\s*([^;]+)/i);
        if (added) return {
          field: 'actions',
          text: 'This specialist cannot gain ' + added[1].split(/,\s*/).map(humanName).join(', ')
            + '. Remove that action from Allowed actions. Its built-in limits can only be tightened.',
        };
        var denied = raw.match(/declared tool ['"]([^'"]+)['"] is denied by this pack/i);
        if (denied) return { field: 'actions', text: humanName(denied[1])
          + ' is blocked for this ' + kindWord() + '. Remove it from Allowed actions or the work steps.' };
        if (/max_risk cannot be raised/i.test(raw)) return {
          field: 'risk', text: 'This specialist’s built-in risk limit cannot be raised. Choose a lower level or create a custom agent.',
        };
        if (/exceeds max_risk/i.test(raw)) return {
          field: 'risk', text: 'An allowed action needs a higher risk level. Remove that action, or choose a higher level if this ' + kindWord() + ' permits it.',
        };
        if (/deny_tools cannot remove/i.test(raw)) return {
          field: 'actions', text: 'A built-in blocked action cannot be unblocked here. Keep its original safety limit.',
        };
        return { field: '', text: 'These settings could not be saved. Choose Check settings to review what needs changing.' };
      }

      const stepsEl = document.getElementById('wf-steps');
      const addBtn = document.getElementById('wf-add');
      const draftsBox = document.getElementById('specialist-drafts');
      function stepLabel(row) {
        const rows = Array.from(stepsEl.querySelectorAll('.wf-step'));
        const name = row.querySelector('.wf-name').value.trim();
        return (name ? '“' + name + '”' : 'Unnamed step') + ' (step ' + (rows.indexOf(row) + 1) + ' of ' + rows.length + ')';
      }
      function refreshSteps() {
        if (!stepsEl) return;
        const rows = Array.from(stepsEl.querySelectorAll('.wf-step'));
        const locked = !!form.closest('[inert]') || !!(draftsBox && (draftsBox.hidden || draftsBox.getAttribute('aria-busy') === 'true'));
        if (addBtn) addBtn.disabled = locked;
        rows.forEach((row, index) => {
          const label = stepLabel(row);
          const unavailable = locked || row.querySelector('.wf-name').matches(':disabled');
          row.querySelector('.wf-name').setAttribute('aria-label', 'Step name: ' + label);
          row.querySelector('.wf-instruction').setAttribute('aria-label', 'What to do in this step: ' + label);
          row.querySelector('.wf-gate').setAttribute('aria-label', 'Does a person check it? ' + label);
          const up = row.querySelector('.wf-up'), down = row.querySelector('.wf-down');
          up.setAttribute('aria-label', 'Move up: ' + label); up.disabled = unavailable || index === 0;
          down.setAttribute('aria-label', 'Move down: ' + label); down.disabled = unavailable || index === rows.length - 1;
          const remove = row.querySelector('.wf-del'); remove.setAttribute('aria-label', 'Remove step: ' + label); remove.disabled = unavailable;
        });
      }
      function stepsChanged(text, focus) {
        refreshSteps();
        stepsEl.dispatchEvent(new Event('input', {bubbles: true}));
        show(text, true);
        if (focus) (focus.disabled ? focus.closest('.wf-step').querySelector('.wf-name') : focus).focus();
      }
      refreshSteps();
      if (draftsBox) new MutationObserver(refreshSteps).observe(draftsBox, {attributes: true, attributeFilter: ['aria-busy', 'hidden']});
      document.addEventListener('lightwork:specialist-draft-loaded', refreshSteps);
      if (stepsEl) stepsEl.addEventListener('input', event => {
        if (event.target.classList.contains('wf-name')) refreshSteps();
      });
      if (addBtn) addBtn.addEventListener('click', () => {
        const row = document.getElementById('wf-row-tpl').content.firstElementChild.cloneNode(true);
        stepsEl.appendChild(row);
        mountToolPicks();
        stepsChanged('Added ' + stepLabel(row) + '.', row.querySelector('.wf-name'));
      });
      mountToolPicks();
      // The short name follows the specialist's name until someone edits it.
      const descInput = document.getElementById('f-description');
      let idTouched = false;
      if (idInput) idInput.addEventListener('input', () => { idTouched = !!idInput.value.trim(); });
      if (idInput && descInput) descInput.addEventListener('input', () => {
        if (!idTouched) idInput.value = descInput.value.trim().toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().split(' ').slice(0, 4).join(' ');
      });
      if (stepsEl) stepsEl.addEventListener('click', (e) => {
        const btn = e.target.closest('button'); if (!btn || btn.disabled) return;
        const row = btn.closest('.wf-step');
        if (!row || row.parentNode !== stepsEl) return;
        if (btn.classList.contains('wf-del')) {
          const label = stepLabel(row), next = row.nextElementSibling || row.previousElementSibling;
          row.remove();
          stepsChanged('Removed ' + label + '. ' + stepsEl.children.length + ' steps remain.', next ? next.querySelector('.wf-name') : addBtn);
          return;
        }
        if (btn.classList.contains('wf-up') && row.previousElementSibling)
          row.parentNode.insertBefore(row, row.previousElementSibling);
        else if (btn.classList.contains('wf-down') && row.nextElementSibling)
          row.parentNode.insertBefore(row.nextElementSibling, row);
        else return;
        stepsChanged('Moved ' + stepLabel(row) + '.', btn);
      });

      function gatherWorkflow() {
        const steps = [];
        stepsEl && stepsEl.querySelectorAll('.wf-step').forEach((row) => {
          const stepName = row.querySelector('.wf-name').value.trim();
          if (!stepName) return;
          steps.push({
            name: stepName,
            instruction: row.querySelector('.wf-instruction').value,
            tools: words(row.querySelector('.wf-tools').value),
            gate: row.querySelector('.wf-gate').value || null,
          });
        });
        // "Require approval to finish": gate the final step (or add a review step).
        if (window.__afApprovalOn && window.__afApprovalOn()) {
          if (steps.length) { if (!steps[steps.length - 1].gate) steps[steps.length - 1].gate = 'review'; }
          else steps.push({ name: 'Final review', instruction: 'A person approves the result before it is finished.', tools: [], gate: 'review' });
        }
        return steps;
      }

      function payload() {
        const autoBox = document.getElementById('agent-autonomy');
        const policy = autoBox && {
          default: document.getElementById('f-auto-default').value,
          low: document.getElementById('f-auto-low').value || null,
          medium: document.getElementById('f-auto-medium').value || null,
          high: document.getElementById('f-auto-high').value || null,
          onboarding: document.getElementById('f-auto-onboarding').checked,
        };
        let autonomy = null;
        if (policy && autoBox.dataset.configOverride === '1') {
          // The server policy wins. Preserve an existing pack setting without
          // copying the server's higher-priority values into the tenant pack.
          if (autoBox.dataset.overridden === '1') autonomy = JSON.parse(autoBox.dataset.pack);
        } else if (policy) {
          const changed = policy.default !== autoBox.dataset.default ||
            (policy.low || '') !== autoBox.dataset.low ||
            (policy.medium || '') !== autoBox.dataset.medium ||
            (policy.high || '') !== autoBox.dataset.high ||
            String(policy.onboarding) !== autoBox.dataset.onboarding;
          if (changed || autoBox.dataset.overridden === '1') autonomy = policy;
        }
        return {
          expected_generation: creating ? 'new' : form.dataset.generation,
          description: document.getElementById('f-description').value,
          persona: document.getElementById('f-persona').value,
          allow_tools: words(document.getElementById('f-allow').value),
          deny_tools: words(document.getElementById('f-deny').value),
          max_risk: document.getElementById('f-risk').value,
          workflow: gatherWorkflow(),
          models: gatherModels(),
          mcp_servers: [...serviceDraft],
          ...(autonomy ? { autonomy } : {}),
        };
      }
      function beginMutation(button) {
        if (button.dataset.inFlight === 'true') return false;
        button.dataset.inFlight = 'true';
        button.disabled = true;
        button.setAttribute('aria-busy', 'true');
        return true;
      }
      function finishMutation(button) {
        delete button.dataset.inFlight;
        button.removeAttribute('aria-busy');
        button.disabled = false;
      }
      async function call(method, path, body) {
        let data;
        try { data = await window.mvFetchJSON(path, { method, body }, 'save these settings'); }
        catch (failure) {
          if (failure.unreadable) throw new Error('The result could not be confirmed. Refresh the page to check.');
          var problem = failure.status === 422 ? saveProblem(failure.detail)
            : { field: '', text: failure.status ? plainError({ status: failure.status, detail: failure.detail }, 'save these settings') : plainError(failure, 'reach Lightwork') };
          var refused = new Error(problem.text);
          refused.field = problem.field;
          throw refused;
        }
        return { status: 200, data };
      }
      // The shared pattern finds missing answers first; nothing typed is cleared.
      function formReady() { return !window.mvFieldErrors || window.mvFieldErrors.validate(form); }
      document.getElementById('btn-validate').addEventListener('click', async () => {
        if (!formReady()) return;
        try {
          fieldMessage('', '');
          const name = targetName();
          if (!name) { show('Give your ' + kindWord() + ' a name first.', false); return; }
          const { data } = await call('POST', `/api/v1/agents/${name}/validate`, payload());
          if (data.errors && data.errors.length) {
            var problem = saveProblem(data.errors.join('; '));
            show(problem.text, false);
            fieldMessage(problem.field, problem.text);
          }
          else if (data.warnings && data.warnings.length) show('Looks good, with notes: ' + data.warnings.join('; '), true);
          else show('Looks good.', true);
        } catch (error) {
          show(error instanceof Error ? error.message : 'That didn\'t work. Refresh the page and try again.', false);
          fieldMessage(error && error.field, error && error.message);
        }
      });
      // ---- tests before publishing ----
      const testsStatus = document.getElementById('agent-tests-status');
      const proposedKey = (n) => 'lightwork-proposed-instructions:' + n;
      function testsLine(v) {
        let text = v.message;
        if (v.latest && v.latest.started_at) {
          const when = window.mvTimeRelative ? window.mvTimeRelative(v.latest.started_at) : '';
          text += ' Last run on these instructions: ' + v.latest.passed + ' of ' + v.latest.total + ' passed' + (when ? ', ' + when : '') + '.';
        }
        if (v.blocked) text += ' Publishing these changes needs a passing run, or a reason that is written to the activity record.';
        else if (!v.gate_on && v.instructions_changed) text += ' This workspace does not require passing tests before publishing.';
        return text;
      }
      async function publishCheck() {
        return window.mvFetchJSON(`/api/v1/agents/${targetName()}/publish-check`, { method: 'POST', body: payload() }, 'read the saved test results');
      }
      let testsTimer = null;
      async function refreshTests() {
        if (!testsStatus) return;
        try { testsStatus.textContent = testsLine(await publishCheck()); }
        catch (failure) { testsStatus.textContent = window.mvErrorText ? window.mvErrorText(failure, 'read the saved test results') : 'The saved test results could not be read.'; }
      }
      if (testsStatus && !creating) {
        // The shared fetch helper loads after this page script.
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', refreshTests);
        else refreshTests();
        document.getElementById('f-persona').addEventListener('input', () => {
          clearTimeout(testsTimer); testsTimer = setTimeout(refreshTests, 600);
        });
        const runLink = document.getElementById('agent-tests-run');
        if (runLink) runLink.addEventListener('click', () => {
          // Hand the unsaved instructions to the comparison in Workforce.
          try { window.sessionStorage.setItem(proposedKey(targetName()), document.getElementById('f-persona').value); } catch (_) { /* no storage: the comparison starts empty */ }
        });
        let pending = null;
        try { pending = window.sessionStorage.getItem(proposedKey(targetName())); } catch (_) { pending = null; }
        const restore = document.getElementById('agent-tests-restore');
        if (pending && restore && pending.trim() !== document.getElementById('f-persona').value.trim()) {
          restore.hidden = false;
          document.getElementById('agent-tests-restore-btn').addEventListener('click', () => {
            document.getElementById('f-persona').value = pending;
            restore.hidden = true;
            refreshTests();
            document.getElementById('f-persona').focus();
          });
        }
      }
      // Changed instructions without a passing run: test them, or publish with a reason.
      async function publishDecision() {
        if (creating) return { ok: true, extra: {} };
        const verdict = await publishCheck();
        if (!verdict.blocked) return { ok: true, extra: {}, line: verdict.tests ? ' ' + testsLine(verdict) : '' };
        const answers = window.mvForm ? await window.mvForm('Publish without a passing test run?', [
          { key: 'reason', label: 'Why publish these instructions before every saved test passes?', type: 'text', required: true,
            help: testsLine(verdict) + ' To test them first, cancel and choose Test these instructions.' },
        ], { okText: 'Publish without passing tests' }) : null;
        if (!answers || !String(answers.reason || '').trim()) {
          show('Nothing was published. Test these instructions first, or give a reason to publish without passing tests.', false);
          const link = document.getElementById('agent-tests-run');
          if (link) link.focus();

        }

      }
      // What taking actions away would have stopped, from the activity
      // record of the last 30 days. Report only; "" when nothing is
      // taken away or it can't be worked out.
      const startAllow = words(document.getElementById('f-allow').value);
      const startDeny = words(document.getElementById('f-deny').value);
      async function toolChangePreview(name) {
        const now = payload();
        const lost = startAllow.filter((t) => !now.allow_tools.includes(t))
          .concat(now.deny_tools.filter((t) => !startDeny.includes(t)));
        if (creating || !lost.length) return '';
        try {
          const data = await window.mvFetchJSON('/api/v1/policy-preview/tools?tools=' + encodeURIComponent(lost.join(',')) +

          return 'In the last 30 days it used ' + what + ' ' + data.calls + (data.calls === 1 ? ' time' : ' times') + ' in ' +
            data.tasks + (data.tasks === 1 ? ' task' : ' tasks') + ' for ' + data.people + (data.people === 1 ? ' person. ' : ' people. ');
        } catch (_) { return ''; }
      }
      const saveBtn = document.getElementById('btn-save');
      let loadedDraftProfile = null;
      window.LWSpecialistDraftEditor = {
        name: targetName,
        identify: name => { if (!editorPrivateLocked && creating && idInput && !idInput.value.trim()) { retainedDraftName = name; idInput.value = name; idTouched = true; } },
        get: () => { if (editorPrivateLocked) throw new Error('Reopen Agent Factory after current access is restored.'); return {...(loadedDraftProfile || {}), ...payload()}; },
        toolServices: value => { if (editorPrivateLocked || !Array.isArray(value?.choices)) return false; serviceChoices = value.choices; renderServices(); return true; },
        clearPrivate: () => {
          editorPrivateLocked = true; loadedDraftProfile = null; modelDraft = {}; serviceDraft = []; serviceChoices = null; retainedDraftName = ''; form.dataset.name = '';
          document.getElementById('agent-tool-service-choices').replaceChildren(); document.getElementById('agent-tool-service-status').textContent = '';
          form.querySelectorAll('input, textarea, select').forEach(field => { field.value = ''; if ('checked' in field) field.checked = false; });
          document.getElementById('f-model').replaceChildren(); document.getElementById('agent-supporting-models').replaceChildren(); stepsEl.replaceChildren();
          form.querySelectorAll('input, textarea, select, button').forEach(field => { field.disabled = true; }); form.hidden = true;
          show('Your account, workspace or access changed. Reopen Agent Factory after access is restored.', false);
        },
        apply: value => {
          if (editorPrivateLocked) return false;
          if (creating && idInput) { retainedDraftName = value.name; idInput.value = value.name; idTouched = true; }
          loadedDraftProfile = structuredClone(value);
          serviceDraft = [...(value.mcp_servers || [])]; renderServices();
          applyModels(value.models);
          document.getElementById('f-description').value = value.description;
          document.getElementById('f-persona').value = value.persona;
          document.getElementById('f-allow').value = value.allow_tools.join(' ');
          document.getElementById('f-deny').value = value.deny_tools.join(' ');
          document.getElementById('f-risk').value = value.max_risk;
          document.querySelectorAll('#risk-seg [data-risk]').forEach(button => { const on = button.dataset.risk === value.max_risk; button.classList.toggle('on', on); button.setAttribute('aria-pressed', String(on)); });
          stepsEl.replaceChildren();
          value.workflow.forEach(step => {
            const row = document.getElementById('wf-row-tpl').content.firstElementChild.cloneNode(true);
            row.querySelector('.wf-name').value = step.name; row.querySelector('.wf-instruction').value = step.instruction;
            row.querySelector('.wf-tools').value = step.tools.join(' '); row.querySelector('.wf-gate').value = step.gate || ''; stepsEl.append(row);
          });
          mountToolPicks();
          if (value.autonomy) {
            ['default','low','medium','high'].forEach(risk => { document.getElementById('f-auto-' + risk).value = value.autonomy[risk] || ''; });
            document.getElementById('f-auto-onboarding').checked = value.autonomy.onboarding;
          }
          document.dispatchEvent(new CustomEvent('lightwork:specialist-draft-loaded'));
        }
      };
      saveBtn.addEventListener('click', async () => {
        if (!formReady()) return;
        const name = targetName();
        if (!name) { show('Give your ' + kindWord() + ' a name first.', false); return; }
        if (window.LWSpecialistDrafts) { await window.LWSpecialistDrafts.reviewEntered('save'); return; }
        show('The complete draft controls are unavailable. Refresh Agent Factory before saving.', false);
        return;
      });
    })();
  </script>
  {% endif %}
  <section class="panel" id="specialist-original-history" data-specialist-original-history hidden aria-labelledby="specialist-original-title">
    <h2 id="specialist-original-title">Your original specialist decisions</h2>
    <p>Read the retained outcome without repeating a Save draft, answer request or publication. Private source details are withheld when current access is unavailable.</p>
    <label for="specialist-original-choice">Original decision</label><select id="specialist-original-choice" class="input"><option value="">Choose…</option></select>
    <button type="button" class="btn" data-specialist-history-refresh>Refresh original decisions</button>
    <p data-specialist-history-status role="status" aria-live="polite"></p><div data-specialist-history-result></div>
  </section>

  {% if selected %}
  <style>
    #jobcard-dlg { border:none; border-radius:var(--radius-lg); padding:0;
                   max-width:720px; width:92vw; box-shadow:var(--shadow-lg);
                   background:var(--panel); color:var(--text); }
    #jobcard-dlg::backdrop { background:var(--scrim); }
    .jc-wrap { padding:var(--space-5); }
    .jc-head { display:flex; align-items:flex-start; gap:var(--space-3); }
    .jc-head h2 { margin:0; font-size:var(--text-xl); }
    .jc-role { color:var(--muted); font-size:var(--text-sm); margin-top: var(--space-0-5); }
    .jc-close { margin-inline-start:auto; border:0; background:transparent;
                color:var(--muted); font-size:1.3rem; cursor:pointer; }
    .jc-cards { display:grid; grid-template-columns:repeat(4,1fr);
                gap:var(--space-2); margin:var(--space-4) 0; }
    .jc-stat { background:var(--surface-sunken); border:1px solid var(--hairline);
               border-radius:var(--radius-md); padding:var(--space-3); }
    .jc-stat .n { font-size:var(--text-lg); font-weight:var(--font-semibold);
                  font-variant-numeric:tabular-nums; }
    .jc-stat .l { font-size:var(--text-xs); color:var(--muted);
                  text-transform:uppercase; letter-spacing:0.04em; }
    .jc-sec { margin-top:var(--space-4); }
    .jc-sec h3 { font-size:var(--text-xs); text-transform:uppercase;
                 letter-spacing:0.06em; color:var(--muted);
                 margin:0 0 var(--space-2); }
    .jc-sec p { margin:0; font-size:var(--text-sm); line-height:1.5; }
    .jc-steps { margin:0; padding-inline-start:1.1rem; font-size:var(--text-sm); }
    .jc-steps li { margin-bottom: var(--space-1); }
    .jc-chips { display:flex; flex-wrap:wrap; gap:6px; }
    .jc-chip { font-size:var(--text-xs); border:1px solid var(--hairline);
               border-radius:var(--radius-pill); padding: var(--space-0-5) 10px;
               background:var(--surface-sunken); }
    .jc-chip.deny { border-color:var(--danger); color:var(--danger); }
    .jc-tier { display:inline-flex; align-items:center; gap:6px; }
    .jc-tier select { font-size:var(--text-sm); }
    .jc-band { font-size:var(--text-xs); font-weight:var(--font-semibold);
               border-radius:var(--radius-pill); padding: var(--space-0-5) 10px; }
    .jc-band.low { background:var(--success-subtle); color:var(--accent); }
    .jc-band.medium { background:var(--info-subtle); color:var(--info); }
    .jc-band.high { background:var(--warn-subtle); color:var(--warn); }
    .jc-band.very_high { background:var(--danger-subtle); color:var(--danger); }
    .jc-grid2 { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-4); }
    @media (max-width:640px){ .jc-cards{grid-template-columns:repeat(2,1fr);}
      .jc-grid2{grid-template-columns:1fr;} }
  </style>
  <dialog id="jobcard-dlg" aria-labelledby="jc-name">
    <div class="jc-wrap">
      <div class="jc-head">
        <div>
          <h2 id="jc-name">…</h2>
          <div class="jc-role" id="jc-role"></div>
        </div>
        <button type="button" class="btn btn--ghost jc-close" id="jc-close">Close</button>
      </div>
      <div class="jc-sec"><h3>Can this {{ 'specialist' if selected_kind == 'specialist' else 'agent' }} start?</h3>
        <p><strong>{{ selected.readiness.label }}</strong></p>
        {% if selected.readiness.state == 'needs_setup' %}
        {% if selected.readiness.missing_labels %}<p class="muted">Required actions: {{ selected.readiness.missing_labels | join(', ') }}. <a href="{{ selected.readiness.fix_url }}">Review setup</a></p>
        {% else %}<p class="muted">This department is turned off. <a href="{{ selected.readiness.fix_url }}">Review setup</a></p>{% endif %}
        {% elif selected.readiness.state == 'unknown' %}
        <p class="muted">Lightwork could not check the required actions. Ask an administrator to review setup before assigning work. <a href="{{ selected.readiness.fix_url }}">Review setup</a></p>
        {% else %}
        <p class="muted">This checks required actions only; live connections, permissions and the AI service are checked when work starts.</p>
        {% endif %}
      </div>
      <div class="jc-sec"><h3>Independence</h3>
        {% if selected.autonomy.levels_enabled %}
        {% set level_names = {'observe': 'Watch only', 'suggest': 'Suggest', 'request': 'Ask before acting', 'auto': 'Act on its own'} %}
        <p>Current levels: low-risk actions — {{ level_names[selected.autonomy.effective.low] }};
          medium-risk actions — {{ level_names[selected.autonomy.effective.medium] }};
          high-risk actions — {{ level_names[selected.autonomy.effective.high] }}.</p>
        {% if selected.autonomy.onboarding %}<p class="muted">Supervision is on, so the chosen levels are lowered one step.</p>{% endif %}
        {% else %}
        <p>Independence levels are off. Consequential actions are staged for a person.</p>
        {% endif %}
        {% if editable %}<p><a href="#agent-autonomy" id="jc-autonomy-open">Review independence settings</a></p>{% endif %}
      </div>
      <div class="jc-cards" id="jc-stats"></div>
      <p class="muted" id="jc-stats-note">Finishing a task does not prove the result was useful. A result that needs approval counts only after a person approves it; this card does not estimate savings or return on investment without customer evidence.</p>
      {% include "_agent_activity.html" %}
      <div class="jc-sec"><h3>Cost level</h3>
        <div class="jc-tier">
          <span class="jc-band" id="jc-band"></span>
          <span class="sub" id="jc-model"></span>
          <span style="margin-inline-start:auto;"></span>
          {% if can_set_model_cost_tier %}<label class="sub" for="jc-band-set">Cost band for this model across Lightwork</label>
          <select id="jc-band-set" class="ctl">
            <option value="">Automatic</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="very_high">Very High</option>
          </select>
          {% endif %}
        </div>
        <p class="muted">This is the configured agent route now. A task can use a different model when routing or a task override applies.{% if can_set_model_cost_tier %} Changing its cost band affects every specialist and workspace that uses that model.{% endif %}</p>
      </div>
      <div class="jc-sec"><h3>Mission</h3><p id="jc-mission"></p></div>
      <div class="jc-sec"><h3>Responsibilities</h3><ol class="jc-steps" id="jc-resp"></ol></div>
      <div class="jc-grid2">
        <div class="jc-sec"><h3>Delivers</h3><p id="jc-deliver"></p></div>
        <div class="jc-sec"><h3>Guardrails — never does</h3><div class="jc-chips" id="jc-guard"></div></div>
      </div>
      <div class="jc-sec"><h3>Tools it can use</h3><div class="jc-chips" id="jc-tools"></div></div>
    </div>
  </dialog>
  <script nonce="{{ csp_script_nonce }}">
  (function () {
    'use strict';
    var NAME = {{ selected.name | tojson }};
    var dlg = document.getElementById('jobcard-dlg');
    var CAN_SET = false;
    function el(id){ return document.getElementById(id); }
    function chips(box, items, cls){
      box.textContent='';
      (items||[]).forEach(function(t){
        var s=document.createElement('span'); s.className='jc-chip'+(cls?' '+cls:'');
        s.textContent=t; box.appendChild(s);
      });
      if(!(items||[]).length){ box.textContent='—'; }
    }
    function stat(n,l){ return '<div class="jc-stat"><div class="n">'+n+
      '</div><div class="l">'+l+'</div></div>'; }
    function money(v){
      if(v==null) return '—';
      var amount=Number(v);
      if(!Number.isFinite(amount)) return '—';
      if(amount>0&&amount<0.01) return '<$0.01';
      return '$'+amount.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
    }
    function render(d){
      var jd=d.job_description||{}, sc=d.scorecard||{}, ct=d.cost_tier||{};
      el('jc-name').textContent=jd.name||NAME;
      el('jc-role').textContent=(jd.role||'')+(jd.suite?(' · '+jd.suite):'');
      el('jc-mission').textContent=jd.mission||'—';
      var resp=el('jc-resp'); resp.textContent='';
      (jd.responsibilities||[]).forEach(function(w){
        var li=document.createElement('li'); li.textContent=w.name?(w.name+' — '+(w.instruction||'')):String(w); resp.appendChild(li);
      });
      if(!(jd.responsibilities||[]).length){ resp.innerHTML='<li class="sub">No steps listed yet. Add steps to its playbook in the editor.</li>'; }
      el('jc-deliver').textContent=(jd.deliverable||'—')+
        (jd.cadence?(' · '+jd.cadence):'')+(jd.gate?(' · needs '+(jd.gate==='approval'?'someone to approve':'someone to review')):'');
      chips(el('jc-tools'), (jd.tools||[]).map(function(t){ return window.mvHuman?mvHuman(t):t; }));
      chips(el('jc-guard'), jd.guardrails, 'deny');
      el('jc-stats').innerHTML =
        stat(Number(sc.runs)||0, 'Tasks') +
        stat(Number(sc.completed)||0, 'Finished tasks') +
        stat(Number(sc.delivered)||0, 'Approved results') +
        stat(money(sc.cost), 'AI cost');
      var band=ct.band||'unknown';
      var b=el('jc-band'); b.className='jc-band '+band; b.textContent=ct.model?(ct.label||band)+' cost':'Model unavailable';
      el('jc-model').textContent=ct.model?('Configured agent model: '+ct.model):'The configured model could not be checked. Refresh the page and try again.';
      var bandSet=el('jc-band-set');
      if(bandSet){bandSet.value=ct.overridden?band:'';bandSet.dataset.original=bandSet.value;bandSet.dataset.model=ct.model||'';bandSet.disabled=!ct.model;}
    }
    function open(){
      dlg.showModal();
      el('jc-name').textContent='Loading…';
      window.mvFetchJSON('/api/v1/agents/'+encodeURIComponent(NAME)+'/jobcard').then(render)
        .catch(function(){ el('jc-name').textContent='Could not load the job card. Close it and try again.'; });
    }
    var btn=el('btn-jobcard'); if(btn) btn.addEventListener('click', open);
    var autoLink=el('jc-autonomy-open'); if(autoLink) autoLink.addEventListener('click', function(){ dlg.close(); });
    el('jc-close').addEventListener('click', function(){ dlg.close(); });
    dlg.addEventListener('click', function(e){ if(e.target===dlg) dlg.close(); });
    var bandSet=el('jc-band-set'); if(bandSet)bandSet.addEventListener('change', async function(){
      var model=this.dataset.model; if(!model) return;
      var band=this.value||null;
      var before=this.dataset.original||'';
      if(!(await mvConfirm('Change the cost band for '+model+' across every specialist and workspace that uses it?', {okText:'Change cost band'}))){this.value=before;return;}
      fetch('/api/v1/model-cost-tiers', {method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:model, band:band})})
        .then(function(r){ if(r.ok) return r.json(); throw r; })
        .then(function(ct){
          var b=el('jc-band'); b.className='jc-band '+ct.band; b.textContent=(ct.label||ct.band)+' cost';
          el('jc-model').textContent='Configured agent model: '+ct.model;
          bandSet.dataset.original=band||'';
        })
        .catch(function(e){ bandSet.value=before; window.mvFail ? mvFail(e, 'change the cost level') : null; });
    });
  })();
  </script>
  {% endif %}
<script src="/static/lightwork-business-agent.js" defer></script>
<script src="/static/lightwork-agent-override-changes.js" defer></script>
<script src="/static/lightwork-agent-activity.js" defer></script>
{% endblock %}
