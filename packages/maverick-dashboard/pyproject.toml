[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "maverick-dashboard"
version = "0.1.7"
description = "Local web dashboard + REST API for Lightwork (FastAPI + htmx)"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Lightwork Authors" }]
readme = "README.md"
dependencies = [
    "maverick-agent>=0.1.7",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.31",
    # starlette is FastAPI's HTTP/multipart core (imported directly by
    # app.py). Keep this at the highest patched advisory floor.
    "starlette>=1.3.1",
    # Built-in speech-to-text engine (whisper.cpp bindings, prebuilt wheels
    # for linux/macos-arm64/windows, no GPU/torch stack). The dashboard owns
    # the mic button, so a dashboard install must transcribe out of the box;
    # kernel-side use stays optional (tools/voice.py degrades without it).
    # Disable via [voice] stt_backend / dashboard_commands.
    "pywhispercpp>=1.5",
]

[project.optional-dependencies]
# Task questions on the Insights page (spend, tasks and tokens by day, status
# or task) run on DuckDB through maverick.duckdb_analytics. Optional: without
# it the page says plainly that the add-on is not installed. The config knob
# is [analytics] task_questions (Settings > All settings; on by default).
duckdb = ["duckdb>=0.9"]

[project.urls]
Homepage = "https://github.com/Daybreak-AI-Labs/LightworkOS"
Repository = "https://github.com/Daybreak-AI-Labs/LightworkOS"
Issues = "https://github.com/Daybreak-AI-Labs/LightworkOS/issues"

[project.scripts]
maverick-dashboard = "maverick_dashboard.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["maverick_dashboard*"]

[tool.setuptools.package-data]
# templates/*.js are Jinja-included by the .html templates (the flow designer's
# FDCore + designer scripts, the shared _dash_helpers). They MUST ship in the
# wheel/PyInstaller bundle or `{% include "flow_designer_core.js" %}` raises
# TemplateNotFound at render time (the page 500s in a built app while working
# from a source checkout). Keep this glob covering every template file type.
# setuptools globs do not cross "/": static/* alone left static/fonts/ out of
# the wheel, so every page 404'd its web fonts and fell back to system fonts.
maverick_dashboard = ["templates/*.html", "templates/*.js", "static/*", "static/fonts/*"]
