[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "maverick-evolve"
version = "0.1.7"
description = "Governed self-evolution for Lightwork: a trusted fitness function (eval harness), a diverse config archive, and config-only evolutionary search. Code self-modification is deliberately out of scope here."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Lightwork Authors" }]
readme = "README.md"
dependencies = [
    "maverick-agent>=0.1.7",
]

[project.urls]
Homepage = "https://github.com/Daybreak-AI-Labs/LightworkOS"
Repository = "https://github.com/Daybreak-AI-Labs/LightworkOS"
Issues = "https://github.com/Daybreak-AI-Labs/LightworkOS/issues"

[project.scripts]
maverick-evolve = "maverick_evolve.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["maverick_evolve*"]
