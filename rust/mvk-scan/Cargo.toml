[package]
name = "mvk-scan"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lightwork native safety scanners (pure logic; shared by the Python and WASM bindings)."

[dependencies]
unicode-normalization = "0.1"
# Most detector patterns delegate to the linear regex backend; PEM uses the
# bounded-repeat VM to avoid NFA expansion. Token boundaries are checked in code.
fancy-regex = "0.20"
